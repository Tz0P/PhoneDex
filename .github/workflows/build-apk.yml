name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      # Same kind of build F-Droid does: unsigned release, no keys needed.
      - name: Release build (F-Droid check)
        run: gradle assembleRelease --no-daemon
      # Installable APK for testing on your phone (debug key).
      - name: Debug build (for testing)
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
